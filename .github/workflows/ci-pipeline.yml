name: CI Pipeline with AI Error Analysis

# Trigger on every push to any branch
on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      ai-provider:
        description: 'AI provider for error analysis ("gemini" or "claude")'
        required: false
        default: 'gemini'
      ai-model:
        description: 'Model ID (leave blank for provider default)'
        required: false
        default: ''

jobs:
  run-pipeline:
    name: Run pipeline and analyze any failures
    runs-on: ubuntu-latest

    # The last step creates a GitHub issue, so the job needs write access
    permissions:
      contents: read
      issues: write

    # ------------------------------------------------------------------ #
    # Resolve AI provider/model from workflow_dispatch inputs or defaults #
    # ------------------------------------------------------------------ #
    env:
      AI_PROVIDER: ${{ github.event.inputs.ai-provider || 'gemini' }}
      AI_MODEL_OVERRIDE: ${{ github.event.inputs.ai-model || '' }}

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout source code                                              #
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. Set up Python runtime                                             #
      # ------------------------------------------------------------------ #
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ------------------------------------------------------------------ #
      # 3. Initialise a fresh error log for this run                        #
      # ------------------------------------------------------------------ #
      - name: Initialise pipeline error log
        run: |
          echo "=== Pipeline Error Log ===" > pipeline_errors.log
          echo "Repository : ${{ github.repository }}" >> pipeline_errors.log
          echo "Run ID     : ${{ github.run_id }}"      >> pipeline_errors.log
          echo "Commit     : ${{ github.sha }}"         >> pipeline_errors.log
          echo "Triggered  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> pipeline_errors.log
          echo "========================================" >> pipeline_errors.log
          echo "" >> pipeline_errors.log

      # ------------------------------------------------------------------ #
      # 4. Step 1 — Out-of-Memory error                                     #
      #    Simulates a data-loader that reads a multi-GB CSV entirely into  #
      #    memory, exhausting available RAM on the runner.                  #
      # ------------------------------------------------------------------ #
      - name: 'Step 1: Data Loader — simulate OOM error'
        id: oom_step
        continue-on-error: true
        run: |
          echo "--- Step 1: Data Loader (simulate_oom.py) ---" >> pipeline_errors.log
          python scripts/simulate_oom.py 2>&1 | tee -a pipeline_errors.log

      # ------------------------------------------------------------------ #
      # 5. Step 2 — TypeError with mixed data types                         #
      #    Simulates an IoT sensor processor that receives string sentinel  #
      #    values ('N/A', 'ERROR', 'OFFLINE') alongside floats.             #
      # ------------------------------------------------------------------ #
      - name: 'Step 2: Sensor Processor — simulate TypeError'
        id: type_error_step
        continue-on-error: true
        run: |
          echo "--- Step 2: Sensor Processor (simulate_type_error.py) ---" >> pipeline_errors.log
          python scripts/simulate_type_error.py 2>&1 | tee -a pipeline_errors.log

      # ------------------------------------------------------------------ #
      # 6. Step 3 — Missing environment variable / secret                   #
      #    Simulates a model-serving startup that expects secrets to be     #
      #    pre-configured in the CI secrets store.  The variables are       #
      #    intentionally not set so the step fails with a KeyError, which   #
      #    mirrors one of the most common real-life CI/CD mistakes.         #
      # ------------------------------------------------------------------ #
      - name: 'Step 3: Model Server — simulate missing env vars'
        id: missing_env_step
        continue-on-error: true
        run: |
          echo "--- Step 3: Model Server (simulate_missing_env.py) ---" >> pipeline_errors.log
          # The required env vars (MODEL_SERVING_ENDPOINT, MODEL_API_SECRET_KEY,
          # INFERENCE_TIMEOUT_MS, FEATURE_STORE_DSN) are deliberately NOT set
          # here to trigger the failure.
          python scripts/simulate_missing_env.py 2>&1 | tee -a pipeline_errors.log

      # ------------------------------------------------------------------ #
      # 7. Step 4 — Dependency / version conflict                           #
      #    Simulates an ImportError caused by two packages in               #
      #    requirements.txt that require mutually exclusive versions of     #
      #    scipy (scikit-learn vs imbalanced-learn upper-bound clash).      #
      # ------------------------------------------------------------------ #
      - name: 'Step 4: ML Trainer — simulate dependency conflict'
        id: dep_conflict_step
        continue-on-error: true
        run: |
          echo "--- Step 4: ML Trainer (simulate_dep_conflict.py) ---" >> pipeline_errors.log
          python scripts/simulate_dep_conflict.py 2>&1 | tee -a pipeline_errors.log

      # ------------------------------------------------------------------ #
      # 8. Step 5 — Flaky integration test (race condition)                 #
      #    Simulates a non-deterministic assertion failure that occurs when  #
      #    the CI worker pool (2 threads) processes async requests in a     #
      #    different order than on a developer's machine (8 threads).       #
      # ------------------------------------------------------------------ #
      - name: 'Step 5: Integration Tests — simulate flaky test failure'
        id: flaky_test_step
        continue-on-error: true
        run: |
          echo "--- Step 5: Integration Tests (simulate_flaky_test.py) ---" >> pipeline_errors.log
          python scripts/simulate_flaky_test.py 2>&1 | tee -a pipeline_errors.log

      # ------------------------------------------------------------------ #
      # 9. Show the aggregated log so it appears in the Actions UI          #
      # ------------------------------------------------------------------ #
      - name: Display aggregated pipeline error log
        if: always()
        run: |
          echo "======= pipeline_errors.log ======="
          cat pipeline_errors.log

      # ------------------------------------------------------------------ #
      # 10. Final step — AI Error Analysis                                  #
      #     Uses the custom local action.  Reads the error log, calls the  #
      #     selected AI model, and opens a GitHub issue.                    #
      # ------------------------------------------------------------------ #
      - name: 'Final Step: Analyse errors with AI and create GitHub issue'
        if: always()
        id: ai_analysis
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ env.AI_PROVIDER }}
          AI_MODEL: ${{ env.AI_MODEL_OVERRIDE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/ai-error-analyzer
        with:
          ai-provider: ${{ env.AI_PROVIDER }}
          ai-model: ${{ env.AI_MODEL_OVERRIDE }}
          log-file: pipeline_errors.log

      # ------------------------------------------------------------------ #
      # 11. Print the created issue URL                                     #
      # ------------------------------------------------------------------ #
      - name: Print issue URL
        if: always() && steps.ai_analysis.outputs.issue-url != ''
        run: |
          echo "GitHub issue created: ${{ steps.ai_analysis.outputs.issue-url }}"
